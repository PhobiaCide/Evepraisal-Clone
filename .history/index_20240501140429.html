<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evepraisal Clone</title>
    <!-- Halfmoon.css -->
    <link href="https://cdn.jsdelivr.net/npm/halfmoon@2.0.1/css/halfmoon.min.css"
        rel="stylesheet" integrity="sha256-SsJizWSIG9JT9Qxbiy8xnYJfjCAkhEQ0hihxRn7jt2M="
        crossorigin="anonymous">
    <!-- Halfmoon modern core theme -->
    <link href="https://cdn.jsdelivr.net/npm/halfmoon@2.0.1/css/cores/halfmoon.modern.css"
        rel="stylesheet" integrity="sha256-DD6elX+jPmbFYPsGvzodUv2+9FHkxHlVtQi0/RJVULs="
        crossorigin="anonymous">
    <!-- Mobile Dark -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/topcoat/0.8.0/css/topcoat-mobile-dark.min.css"
        integrity="sha512-3axCmtM0Aq1Zin8EQ/BgsaYCdR9jY488aH7JYG4zTUeEHWGqOjm86hjL4cx6nIWGLMJ/UU4m+MOcQ2D/f2QdfQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        .bg-custom {
            background-image: linear-gradient(-33deg, #11113388, #113131bb);
        }

        .search-form {
            position: absolute;
            top: 1em;
            right: 1em;
            transition: padding 0.3s;
        }

        .search-form.focus {
            padding-right: 100px; /* Adjust padding as needed */
        }

        .form-area {
            margin-top: 3rem;
        }

        .instructions {
            margin-top: 3rem;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body data-bs-theme="dark" data-bs-core="modern" class="text-body subpixel-antialiased">
    <header class="fixed-top bg-custom bg-body bg-gradient border border-5 border-start-0 border-top-0 border-end-0 shadow-lg pt-2">
        <u style="position:relative; bottom:0;">
            <h1 class="d-inline text-primary bg-light  rounded-pill rounded-start-0 rounded-top-0 brand text-start display-2 p-1 pe-5">Evepraisal</h1><sub style="position: absolute; right: 17%; bottom: -20%; font-size: 1.5em" class="d-inline bg-light text-warning clone">Clone</sub>
        </u>
        <h5 style="line-height: 0;font-weight: 100;" class="text-secondary text-center fs-4 subtitle pt-4"><sup><i>Easy-to-use</i> <strong>AND</strong> <i>familiar</i> parser and price estimator tool for <u><mark>Eve
                            Online</mark></u></sup>
        </h5>
        <search style="position: absolute;right: 0; top:0;" class="search-form bg-info rounded-pill rounded-top-0 rounded-end-0 border border-bottom-0 border-end-0 border-3 border-info-subtle ps-0 pb-1" action="search" method="GET" role="search">
            <form style="width: 47vw; top:0;" class="input-group h-auto border border-bottom-0 border-end-0 border-info-subtle border-2 rounded-pill rounded-top-0 rounded-end-0 ps-4">
                <input class="topcoat-search-input form-control border border-start-0 border-top-0 border-end-0 border-primary ps-3 h-auto" id="search" name="q" type="text" placeholder="What are you looking for?" data="Item Name..." autocomplete="off" spellcheck="false" dir="auto" aria-label="search">
                <input type="button" class="btn topcoat-button--cta d-sm-none input-group-text rounded-end-0 h-auto" aria-label="Submit search query" value="Search">
            </form>
        </search>
    </header>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const searchInput = document.getElementById('search');

            searchInput.addEventListener('focus', function () {
                // Add focus class to search form
                document.querySelector('.search-form').classList.add('focus');
                // Modify width of search input
                searchInput.style.width = '75vw';
            });

            searchInput.addEventListener('blur', function () {
                // Remove focus class from search form
                document.querySelector('.search-form').classList.remove('focus');
                // Reset width of search input
                searchInput.style.width = '';
            });
        });
    </script>
</body>

</html>
